    <circle cx="132" cy="120" r="8" fill="#E8503A" stroke="none"/>
    <circle cx="104" cy="138" r="7" fill="#E8503A" stroke="none"/>
    <circle cx="140" cy="92" r="5" fill="#E8503A" stroke="none"/>
