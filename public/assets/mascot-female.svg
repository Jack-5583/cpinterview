    <path d="M148 168 L162 240" fill="none" stroke-width="6"/>
    <path d="M22 150 C22 140 46 137 100 137 C154 137 178 140 178 150 C178 166 144 172 100 172 C56 172 22 166 22 150 Z" fill="#C99A6B"/>
