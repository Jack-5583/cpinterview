# Render.com 배포 설정 (https://render.com)
# 저장소를 연결하면 이 파일을 읽어 자동으로 웹 서비스를 생성합니다.
services:
  - type: web
    name: interview-waiting
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # 상태 파일을 유지하려면 아래 디스크를 활성화하고 DATA_DIR 을 맞춰주세요.
      # - key: DATA_DIR
      #   value: /var/data
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
